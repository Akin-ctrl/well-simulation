<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service health design</title><link rel="stylesheet" href="../../../monorepo/apps/website/app/styles/tokens.css"><link rel="stylesheet" href="../milestone-9/mockups/mockups.css"><style>html{color-scheme:light}.content{max-width:1320px;margin:auto;padding:24px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-block:16px}.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{padding:20px;min-width:0}.value{font-size:22px;font-weight:700;margin:12px 0}.muted{color:var(--twin-muted);overflow-wrap:anywhere}.good{color:var(--twin-success)}.bad{color:var(--twin-danger)}.warn{color:var(--twin-warning)}svg{width:100%;height:150px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-block:20px}.empty{min-height:150px;display:grid;place-items:center;text-align:center}.content h2{margin-top:24px}@media(max-width:700px){.cards,.charts{grid-template-columns:minmax(0,1fr)}.content{padding:16px}}</style><script src="screens.js" defer></script></head><body><header class="review"><strong>Service health design</strong><label for="state">State</label><select id="state"><option>normal</option><option>warming</option><option>service_down</option><option>dependency_down</option><option>stale</option><option>empty</option><option>error</option><option>permission</option></select><span>Illustrative data</span></header><main class="content" id="workspace"></main></body></html>
