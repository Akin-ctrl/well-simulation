openapi: 3.1.0
info:
  title: Twin-Core Internal API
  version: 0.3.0
  summary: Internal API for the wellhead twin-core service.
  description: |
    Health, readiness, metrics, lifecycle state, and existing simulator
    telemetry reads are implemented. Process state is a synthetic, uncalibrated
    reduced-order model, separate from the current historian simulator.
    Controls, forecasts, and scenarios below
    are planned endpoints, not available in the running service.
servers:
  - url: http://twin-core:8000
    description: Internal Docker Compose service address.
tags:
  - name: Health
  - name: State
  - name: Telemetry
  - name: Controls
  - name: Forecasts
  - name: Scenarios
paths:
  /health:
    get:
      tags: [Health]
      summary: Process liveness check.
      operationId: getTwinHealth
      responses:
        "200":
          description: Twin-core process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [Health]
      summary: Fleet, scheduler, and model readiness.
      operationId: getTwinReadiness
      responses:
        "200":
          description: All active wells have running model state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus-compatible service metrics.
      operationId: getTwinMetrics
      responses:
        "200":
          description: Twin-core service counters and gauges.
          content:
            text/plain:
              schema:
                type: string
  /wellheads/{wellheadId}/latest-telemetry:
    get:
      tags: [Telemetry]
      summary: Latest current-simulator readings from the historian.
      operationId: getWellheadLatestTelemetry
      parameters:
        - $ref: "#/components/parameters/WellheadId"
      responses:
        "200":
          description: Per-parameter latest readings with quality and timestamps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetrySnapshot"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/HistorianUnavailable"
  /wellheads/{wellheadId}/state:
    get:
      tags: [State]
      summary: Current synthetic model lifecycle and process state.
      operationId: getWellheadState
      parameters:
        - $ref: "#/components/parameters/WellheadId"
      responses:
        "200":
          description: Current lifecycle state and optional physical model state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellheadState"
        "404":
          $ref: "#/components/responses/NotFound"
  /wellheads/{wellheadId}/controls:
    post:
      tags: [Controls]
      summary: Planned endpoint for applying bounded live control inputs.
      operationId: applyWellheadControls
      parameters:
        - $ref: "#/components/parameters/WellheadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlInput"
      responses:
        "202":
          description: Control input accepted for the next model tick.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlAccepted"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /wellheads/{wellheadId}/forecast:
    post:
      tags: [Forecasts]
      summary: Planned endpoint for short operational forecasts.
      operationId: createWellheadForecast
      parameters:
        - $ref: "#/components/parameters/WellheadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForecastRequest"
      responses:
        "200":
          description: Forecast generated from current model state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /scenarios:
    post:
      tags: [Scenarios]
      summary: Planned endpoint for isolated what-if scenario execution.
      operationId: runScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioRequest"
      responses:
        "200":
          description: Scenario run completed against cloned model state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
components:
  parameters:
    WellheadId:
      name: wellheadId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    NotFound:
      description: Requested wellhead or state snapshot does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request body failed validation or exceeded safe control bounds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    HistorianUnavailable:
      description: Historian read failed, timed out, or read capacity was full.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: twin-core
        timestamp:
          type: string
          format: date-time
    ReadinessResponse:
      type: object
      required:
        - status
        - service
        - modelVersion
        - modelStatus
        - activeWellheads
        - runningWellheads
        - reason
        - timestamp
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        service:
          type: string
          const: twin-core
        modelVersion:
          type: string
        modelStatus:
          type: string
          enum: [running, lagging, degraded, unavailable]
        activeWellheads:
          type: integer
          minimum: 0
        runningWellheads:
          type: integer
          minimum: 0
        reason:
          type: string
        timestamp:
          type: string
          format: date-time
    WellheadState:
      type: object
      required:
        - wellheadId
        - modelVersion
        - status
        - reason
        - tickIndex
        - skippedTicks
        - lastTickAt
        - process
      properties:
        wellheadId:
          type: integer
          minimum: 1
        modelVersion:
          type: string
        status:
          type: string
          enum: [initializing, running, lagging, recovering, degraded, unavailable]
        reason:
          type: string
        tickIndex:
          type: integer
          minimum: 0
        skippedTicks:
          type: integer
          minimum: 0
        lastTickAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        process:
          oneOf:
            - $ref: "#/components/schemas/ProcessState"
            - type: "null"
    ProcessState:
      type: object
      description: Synthetic model output. It is not historian telemetry or a field measurement.
      required:
        - source
        - fieldCalibrated
        - simulatedAt
        - reservoirPressureProxyPsi
        - tubingPressurePsi
        - casingPressurePsi
        - flowRateBpd
        - chokePositionPercent
        - masterValveOpen
        - wingValveOpen
        - swabValveOpen
        - pumpOn
        - emergencyShutdown
        - pumpFlowFactor
        - wellheadTemperatureF
        - waterCutPercent
        - blockageFactor
        - corrosionFactor
      properties:
        source:
          type: string
          const: synthetic_reduced_order_model
        fieldCalibrated:
          type: boolean
          const: false
        simulatedAt:
          type: string
          format: date-time
        reservoirPressureProxyPsi:
          type: number
        tubingPressurePsi:
          type: number
        casingPressurePsi:
          type: number
        flowRateBpd:
          type: number
        chokePositionPercent:
          type: number
          minimum: 0
          maximum: 100
        masterValveOpen:
          type: boolean
        wingValveOpen:
          type: boolean
        swabValveOpen:
          type: boolean
        pumpOn:
          type: boolean
        emergencyShutdown:
          type: boolean
        pumpFlowFactor:
          type: number
          minimum: 0
          maximum: 1
        wellheadTemperatureF:
          type: number
        waterCutPercent:
          type: number
          minimum: 0
          maximum: 100
        blockageFactor:
          type: number
          minimum: 0
          maximum: 1
        corrosionFactor:
          type: number
    TelemetrySnapshot:
      type: object
      required:
        - wellheadId
        - observedAt
        - source
        - modelGenerated
        - quality
        - complete
        - expectedParameterCount
        - availableParameterCount
        - readings
      properties:
        wellheadId:
          type: integer
          minimum: 1
        observedAt:
          type: string
          format: date-time
        source:
          type: string
          const: current_simulator_via_historian
        modelGenerated:
          type: boolean
          const: false
        quality:
          type: string
          enum: [fresh, stale, partial, missing, invalid, clock_skew]
        complete:
          type: boolean
        expectedParameterCount:
          type: integer
          minimum: 0
        availableParameterCount:
          type: integer
          minimum: 0
        readings:
          type: array
          items:
            $ref: "#/components/schemas/TelemetryReading"
    TelemetryReading:
      type: object
      required:
        - code
        - unit
        - value
        - sourceTimestamp
        - insertedAt
        - ageSeconds
        - quality
      properties:
        code:
          type: string
        unit:
          oneOf:
            - type: string
            - type: "null"
        value:
          oneOf:
            - type: number
            - type: "null"
        sourceTimestamp:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        insertedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        ageSeconds:
          oneOf:
            - type: number
            - type: "null"
        quality:
          type: string
          enum: [fresh, stale, missing, invalid, clock_skew]
    ControlInput:
      type: object
      additionalProperties: false
      properties:
        chokePositionPercent:
          type: number
          minimum: 0
          maximum: 100
        valveState:
          type: string
          enum: [open, closed]
        pumpState:
          type: string
          enum: [on, off]
        reason:
          type: string
          maxLength: 240
    ControlAccepted:
      type: object
      required: [accepted, effectiveFromTick]
      properties:
        accepted:
          type: boolean
          const: true
        effectiveFromTick:
          type: string
          format: date-time
    ForecastRequest:
      type: object
      required: [horizonMinutes]
      properties:
        horizonMinutes:
          type: integer
          minimum: 5
          maximum: 240
        timestepSeconds:
          type: integer
          minimum: 1
          maximum: 300
    ForecastResponse:
      type: object
      required: [wellheadId, generatedAt, horizonMinutes, points]
      properties:
        wellheadId:
          type: integer
        generatedAt:
          type: string
          format: date-time
        horizonMinutes:
          type: integer
        points:
          type: array
          items:
            $ref: "#/components/schemas/ForecastPoint"
    ForecastPoint:
      type: object
      required: [timestamp, pressurePsi, temperatureF, flowRateBpd, confidence]
      properties:
        timestamp:
          type: string
          format: date-time
        pressurePsi:
          type: number
        temperatureF:
          type: number
        flowRateBpd:
          type: number
        confidence:
          type: number
          minimum: 0
          maximum: 1
    ScenarioRequest:
      type: object
      required: [wellheadId, name, horizonMinutes, controls]
      properties:
        wellheadId:
          type: integer
        name:
          type: string
          maxLength: 120
        horizonMinutes:
          type: integer
          minimum: 5
          maximum: 240
        controls:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioControlStep"
    ScenarioControlStep:
      type: object
      required: [offsetMinutes, input]
      properties:
        offsetMinutes:
          type: integer
          minimum: 0
        input:
          $ref: "#/components/schemas/ControlInput"
    ScenarioResponse:
      type: object
      required: [scenarioId, generatedAt, points]
      properties:
        scenarioId:
          type: string
        generatedAt:
          type: string
          format: date-time
        points:
          type: array
          items:
            $ref: "#/components/schemas/ForecastPoint"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
