openapi: 3.1.0
info:
  title: Twin-Core Internal API
  version: 0.5.0
  summary: Internal API for the wellhead twin-core service.
  description: |
    Health, readiness, metrics, lifecycle state, complete model fleet snapshots,
    source-labelled historian telemetry reads, forecasts, and isolated scenarios
    are implemented. Process values are synthetic and uncalibrated. Live controls
    remain planned.
servers:
  - url: http://twin-core:8000
    description: Internal Docker Compose service address.
tags:
  - name: Health
  - name: State
  - name: Telemetry
  - name: Controls
  - name: Forecasts
  - name: Scenarios
paths:
  /health:
    get:
      tags: [Health]
      summary: Process liveness check.
      operationId: getTwinHealth
      responses:
        "200":
          description: Twin-core process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [Health]
      summary: Fleet, scheduler, and model readiness.
      operationId: getTwinReadiness
      responses:
        "200":
          description: All active wells have running model state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus-compatible service metrics.
      operationId: getTwinMetrics
      responses:
        "200":
          description: Twin-core service counters and gauges.
          content:
            text/plain:
              schema:
                type: string
  /model-snapshot:
    get:
      tags: [Telemetry]
      summary: Complete current model fleet for the internal Modbus gateway.
      operationId: getModelSnapshot
      responses:
        "200":
          description: Every active well has a running model state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelFleetSnapshot"
        "503":
          description: A model tick or active well is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wellheads/{wellheadId}/latest-telemetry:
    get:
      tags: [Telemetry]
      summary: Latest source-labelled readings from the historian.
      operationId: getWellheadLatestTelemetry
      parameters:
        - $ref: "#/components/parameters/WellheadId"
      responses:
        "200":
          description: Per-parameter latest readings with quality and timestamps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetrySnapshot"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/HistorianUnavailable"
  /wellheads/{wellheadId}/state:
    get:
      tags: [State]
      summary: Current synthetic model lifecycle and process state.
      operationId: getWellheadState
      parameters:
        - $ref: "#/components/parameters/WellheadId"
      responses:
        "200":
          description: Current lifecycle state and optional physical model state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellheadState"
        "404":
          $ref: "#/components/responses/NotFound"
  /wellheads/{wellheadId}/controls:
    post:
      tags: [Controls]
      summary: Planned endpoint for applying bounded live control inputs.
      operationId: applyWellheadControls
      parameters:
        - $ref: "#/components/parameters/WellheadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlInput"
      responses:
        "202":
          description: Control input accepted for the next model tick.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlAccepted"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /wellheads/{wellheadId}/forecast:
    post:
      tags: [Forecasts]
      summary: Create and persist a bounded forecast from current model state.
      description: Requires X-Twin-Internal-Token and X-Twin-Actor-Id headers.
      operationId: createWellheadForecast
      parameters:
        - $ref: "#/components/parameters/WellheadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForecastRequest"
      responses:
        "201":
          description: Forecast persisted and returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HistorianUnavailable"
  /scenarios:
    post:
      tags: [Scenarios]
      summary: Create and persist an isolated what-if scenario.
      description: Requires X-Twin-Internal-Token and X-Twin-Actor-Id headers.
      operationId: runScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioRequest"
      responses:
        "201":
          description: Scenario and unchanged baseline persisted together.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/HistorianUnavailable"
components:
  parameters:
    WellheadId:
      name: wellheadId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    NotFound:
      description: Requested wellhead or state snapshot does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request body failed validation or exceeded safe control bounds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    HistorianUnavailable:
      description: Historian read failed, timed out, or read capacity was full.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The internal service token is absent or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: twin-core
        timestamp:
          type: string
          format: date-time
    ReadinessResponse:
      type: object
      required:
        - status
        - service
        - modelVersion
        - modelStatus
        - activeWellheads
        - runningWellheads
        - reason
        - timestamp
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        service:
          type: string
          const: twin-core
        modelVersion:
          type: string
        modelStatus:
          type: string
          enum: [running, lagging, degraded, unavailable]
        activeWellheads:
          type: integer
          minimum: 0
        runningWellheads:
          type: integer
          minimum: 0
        reason:
          type: string
          description: >-
            The first thing stopping readiness, or service_ready_model_running.
            Values include historian_unavailable, no_active_wellheads,
            invalid_model_parameters, wall_clock_moved_back (ticks held after
            the wall clock went back), tick_clock_drift (last tick more than
            3 seconds from wall time), tick_loop_not_current, and
            model_not_running.
        timestamp:
          type: string
          format: date-time
    WellheadState:
      type: object
      required:
        - wellheadId
        - modelVersion
        - status
        - reason
        - tickIndex
        - skippedTicks
        - lastTickAt
        - process
        - restoredFrom
        - lastRecoveryEvent
      properties:
        wellheadId:
          type: integer
          minimum: 1
        modelVersion:
          type: string
        status:
          type: string
          enum: [initializing, running, lagging, recovering, degraded, unavailable]
        reason:
          type: string
        tickIndex:
          type: integer
          minimum: 0
        skippedTicks:
          type: integer
          minimum: 0
        lastTickAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        process:
          oneOf:
            - $ref: "#/components/schemas/ProcessState"
            - type: "null"
        restoredFrom:
          description: UTC time of the snapshot restored for this process, if any.
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        lastRecoveryEvent:
          description: Last startup recovery decision for this well in this process.
          oneOf:
            - type: object
              required: [type, time]
              properties:
                type:
                  type: string
                  enum: [snapshot_restored, cold_start_no_snapshot, snapshot_incompatible]
                time:
                  type: string
                  format: date-time
            - type: "null"
    ProcessState:
      type: object
      description: Synthetic model output. It is not historian telemetry or a field measurement.
      required:
        - source
        - fieldCalibrated
        - simulatedAt
        - reservoirPressureProxyPsi
        - tubingPressurePsi
        - casingPressurePsi
        - flowRateBpd
        - chokePositionPercent
        - masterValveOpen
        - wingValveOpen
        - swabValveOpen
        - pumpOn
        - emergencyShutdown
        - pumpFlowFactor
        - wellheadTemperatureF
        - waterCutPercent
        - blockageFactor
        - corrosionFactor
        - annulusPressurePsi
        - annulusTemperatureF
        - oilRateBpd
        - waterRateBpd
        - gasRateScfd
        - gasOilRatioScfStb
        - sandDetectorPpm
        - corrosionRateMpy
        - h2sLevelPpm
        - co2LevelPercent
        - vibrationMmS
      properties:
        source:
          type: string
          const: synthetic_reduced_order_model
        fieldCalibrated:
          type: boolean
          const: false
        simulatedAt:
          type: string
          format: date-time
        reservoirPressureProxyPsi:
          type: number
        tubingPressurePsi:
          type: number
        casingPressurePsi:
          type: number
        flowRateBpd:
          type: number
        chokePositionPercent:
          type: number
          minimum: 0
          maximum: 100
        masterValveOpen:
          type: boolean
        wingValveOpen:
          type: boolean
        swabValveOpen:
          type: boolean
        pumpOn:
          type: boolean
        emergencyShutdown:
          type: boolean
        pumpFlowFactor:
          type: number
          minimum: 0
          maximum: 1
        wellheadTemperatureF:
          type: number
        waterCutPercent:
          type: number
          minimum: 0
          maximum: 100
        blockageFactor:
          type: number
          minimum: 0
          maximum: 1
        corrosionFactor:
          type: number
        annulusPressurePsi:
          type: number
          minimum: 0
        annulusTemperatureF:
          type: number
        oilRateBpd:
          type: number
          minimum: 0
        waterRateBpd:
          type: number
          minimum: 0
        gasRateScfd:
          type: number
          minimum: 0
        gasOilRatioScfStb:
          type: number
          minimum: 0
        sandDetectorPpm:
          type: number
          minimum: 0
        corrosionRateMpy:
          type: number
          minimum: 0
        h2sLevelPpm:
          type: number
          minimum: 0
        co2LevelPercent:
          type: number
          minimum: 0
          maximum: 100
        vibrationMmS:
          type: number
          minimum: 0
    ModelFleetSnapshot:
      type: object
      required: [source, fieldCalibrated, modelVersion, wellheads]
      properties:
        source:
          type: string
          const: synthetic_reduced_order_model
        fieldCalibrated:
          type: boolean
          const: false
        modelVersion:
          type: string
        wellheads:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WellheadState"
    TelemetrySnapshot:
      type: object
      required:
        - wellheadId
        - observedAt
        - source
        - modelGenerated
        - quality
        - complete
        - expectedParameterCount
        - availableParameterCount
        - readings
      properties:
        wellheadId:
          type: integer
          minimum: 1
        observedAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [synthetic_random_simulator, synthetic_reduced_order_model, mixed, unknown]
        modelGenerated:
          type: boolean
        quality:
          type: string
          enum: [fresh, stale, partial, missing, invalid, clock_skew]
        complete:
          type: boolean
        expectedParameterCount:
          type: integer
          minimum: 0
        availableParameterCount:
          type: integer
          minimum: 0
        readings:
          type: array
          items:
            $ref: "#/components/schemas/TelemetryReading"
    TelemetryReading:
      type: object
      required:
        - code
        - unit
        - value
        - sourceTimestamp
        - insertedAt
        - ageSeconds
        - quality
        - source
      properties:
        code:
          type: string
        unit:
          oneOf:
            - type: string
            - type: "null"
        value:
          oneOf:
            - type: number
            - type: "null"
        sourceTimestamp:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        insertedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        ageSeconds:
          oneOf:
            - type: number
            - type: "null"
        quality:
          type: string
          enum: [fresh, stale, missing, invalid, clock_skew]
        source:
          oneOf:
            - type: string
              enum: [synthetic_random_simulator, synthetic_reduced_order_model]
            - type: "null"
    ControlInput:
      type: object
      additionalProperties: false
      properties:
        chokePositionPercent:
          type: number
          minimum: 0
          maximum: 100
        valveState:
          type: string
          enum: [open, closed]
        pumpState:
          type: string
          enum: [on, off]
        reason:
          type: string
          maxLength: 240
    ControlAccepted:
      type: object
      required: [accepted, effectiveFromTick]
      properties:
        accepted:
          type: boolean
          const: true
        effectiveFromTick:
          type: string
          format: date-time
    ForecastRequest:
      type: object
      additionalProperties: false
      properties:
        horizonSeconds:
          type: integer
          minimum: 300
          maximum: 7200
          default: 1800
        stepSeconds:
          type: integer
          minimum: 5
          maximum: 300
          default: 60
      description: Horizon must be divisible by step size.
    ForecastResponse:
      $ref: "#/components/schemas/ProjectionResponse"
    ScenarioRequest:
      type: object
      additionalProperties: false
      required: [wellheadId, name, horizonSeconds, stepSeconds, controls]
      properties:
        wellheadId:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 120
        horizonSeconds:
          type: integer
          minimum: 300
          maximum: 7200
        stepSeconds:
          type: integer
          minimum: 5
          maximum: 300
        controls:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/ScenarioControlStep"
      description: Horizon must divide by step; offsets must increase and stay below horizon.
    ScenarioControlStep:
      type: object
      additionalProperties: false
      required: [offsetMinutes, input]
      properties:
        offsetMinutes:
          type: integer
          minimum: 0
        input:
          $ref: "#/components/schemas/ScenarioControlChange"
    ScenarioControlChange:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        chokePositionPercent:
          type: number
          minimum: 0
          maximum: 100
        masterValveOpen:
          type: boolean
        wingValveOpen:
          type: boolean
        pumpOn:
          type: boolean
        emergencyShutdown:
          type: boolean
    ScenarioResponse:
      $ref: "#/components/schemas/ProjectionResponse"
    ProjectionResponse:
      type: object
      required: [runId, kind, wellheadId, name, source, fieldCalibrated,
        modelVersion, baseSimulatedAt, generatedAt, horizonSeconds,
        stepSeconds, confidence, points]
      properties:
        runId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [forecast, scenario]
        wellheadId:
          type: integer
          minimum: 1
        name:
          type: [string, "null"]
        source:
          type: string
          const: synthetic_reduced_order_model
        fieldCalibrated:
          type: boolean
          const: false
        modelVersion:
          type: string
        baseSimulatedAt:
          type: string
          format: date-time
        generatedAt:
          type: string
          format: date-time
        horizonSeconds:
          type: integer
        stepSeconds:
          type: integer
        confidence:
          type: object
          required: [method, score, label, reasons]
          properties:
            method:
              type: string
              const: heuristic_uncalibrated
            score:
              type: number
              minimum: 0
              maximum: 1
            label:
              type: string
              enum: [moderate, low]
            reasons:
              type: array
              items:
                type: string
        points:
          type: array
          minItems: 1
          maxItems: 1440
          items:
            $ref: "#/components/schemas/ProjectionPoint"
    ProjectionPoint:
      type: object
      required: [elapsedSeconds, timestamp, values, alarmRisk, triggeredRuleIds]
      properties:
        elapsedSeconds:
          type: integer
          minimum: 1
        timestamp:
          type: string
          format: date-time
        values:
          type: object
          additionalProperties:
            type: number
        alarmRisk:
          type: string
          enum: [none, warning, critical, unknown]
        triggeredRuleIds:
          type: array
          items:
            type: integer
        baselineValues:
          type: object
          additionalProperties:
            type: number
        baselineAlarmRisk:
          type: string
          enum: [none, warning, critical, unknown]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
