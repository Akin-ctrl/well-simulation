openapi: 3.1.0
info:
  title: Twin-Core Internal API
  version: 0.1.0
  summary: Planned internal API for the future lightweight wellhead twin-core service.
  description: |
    This is a design contract for the next implementation phase. The twin-core
    service does not exist yet. These endpoints describe the minimum credible
    boundary needed to evolve the current monitoring simulation into a lightweight
    digital twin without pretending to be a full high-fidelity reservoir simulator.
servers:
  - url: http://twin-core:8000
    description: Planned Docker Compose service address.
tags:
  - name: Health
  - name: State
  - name: Controls
  - name: Forecasts
  - name: Scenarios
paths:
  /health:
    get:
      tags: [Health]
      summary: Planned liveness check.
      operationId: getTwinHealth
      responses:
        "200":
          description: Twin-core process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [Health]
      summary: Planned readiness check.
      operationId: getTwinReadiness
      responses:
        "200":
          description: Twin-core has loaded model defaults and can serve state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /wellheads/{wellheadId}/state:
    get:
      tags: [State]
      summary: Planned endpoint for current model state.
      operationId: getWellheadState
      parameters:
        - $ref: "#/components/parameters/WellheadId"
      responses:
        "200":
          description: Current state of the reduced-order wellhead model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellheadState"
        "404":
          $ref: "#/components/responses/NotFound"
  /wellheads/{wellheadId}/controls:
    post:
      tags: [Controls]
      summary: Planned endpoint for applying bounded live control inputs.
      operationId: applyWellheadControls
      parameters:
        - $ref: "#/components/parameters/WellheadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlInput"
      responses:
        "202":
          description: Control input accepted for the next model tick.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlAccepted"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /wellheads/{wellheadId}/forecast:
    post:
      tags: [Forecasts]
      summary: Planned endpoint for short operational forecasts.
      operationId: createWellheadForecast
      parameters:
        - $ref: "#/components/parameters/WellheadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForecastRequest"
      responses:
        "200":
          description: Forecast generated from current model state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /scenarios:
    post:
      tags: [Scenarios]
      summary: Planned endpoint for isolated what-if scenario execution.
      operationId: runScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioRequest"
      responses:
        "200":
          description: Scenario run completed against cloned model state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
components:
  parameters:
    WellheadId:
      name: wellheadId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    NotFound:
      description: Requested wellhead or state snapshot does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request body failed validation or exceeded safe control bounds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: twin-core
        timestamp:
          type: string
          format: date-time
    ReadinessResponse:
      type: object
      required: [status, service, modelVersion, timestamp]
      properties:
        status:
          type: string
          const: ready
        service:
          type: string
          const: twin-core
        modelVersion:
          type: string
        timestamp:
          type: string
          format: date-time
    WellheadState:
      type: object
      required:
        - wellheadId
        - modelVersion
        - simulatedAt
        - pressurePsi
        - temperatureC
        - flowRateBpd
        - chokePositionPercent
        - valveState
      properties:
        wellheadId:
          type: integer
        modelVersion:
          type: string
        simulatedAt:
          type: string
          format: date-time
        pressurePsi:
          type: number
        temperatureC:
          type: number
        flowRateBpd:
          type: number
        chokePositionPercent:
          type: number
          minimum: 0
          maximum: 100
        valveState:
          type: string
          enum: [open, closed]
        waterCutPercent:
          type: number
          minimum: 0
          maximum: 100
        blockageFactor:
          type: number
          minimum: 0
          maximum: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
    ControlInput:
      type: object
      additionalProperties: false
      properties:
        chokePositionPercent:
          type: number
          minimum: 0
          maximum: 100
        valveState:
          type: string
          enum: [open, closed]
        pumpState:
          type: string
          enum: [on, off]
        reason:
          type: string
          maxLength: 240
    ControlAccepted:
      type: object
      required: [accepted, effectiveFromTick]
      properties:
        accepted:
          type: boolean
          const: true
        effectiveFromTick:
          type: string
          format: date-time
    ForecastRequest:
      type: object
      required: [horizonMinutes]
      properties:
        horizonMinutes:
          type: integer
          minimum: 5
          maximum: 240
        timestepSeconds:
          type: integer
          minimum: 1
          maximum: 300
    ForecastResponse:
      type: object
      required: [wellheadId, generatedAt, horizonMinutes, points]
      properties:
        wellheadId:
          type: integer
        generatedAt:
          type: string
          format: date-time
        horizonMinutes:
          type: integer
        points:
          type: array
          items:
            $ref: "#/components/schemas/ForecastPoint"
    ForecastPoint:
      type: object
      required: [timestamp, pressurePsi, temperatureC, flowRateBpd, confidence]
      properties:
        timestamp:
          type: string
          format: date-time
        pressurePsi:
          type: number
        temperatureC:
          type: number
        flowRateBpd:
          type: number
        confidence:
          type: number
          minimum: 0
          maximum: 1
    ScenarioRequest:
      type: object
      required: [wellheadId, name, horizonMinutes, controls]
      properties:
        wellheadId:
          type: integer
        name:
          type: string
          maxLength: 120
        horizonMinutes:
          type: integer
          minimum: 5
          maximum: 240
        controls:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioControlStep"
    ScenarioControlStep:
      type: object
      required: [offsetMinutes, input]
      properties:
        offsetMinutes:
          type: integer
          minimum: 0
        input:
          $ref: "#/components/schemas/ControlInput"
    ScenarioResponse:
      type: object
      required: [scenarioId, generatedAt, points]
      properties:
        scenarioId:
          type: string
        generatedAt:
          type: string
          format: date-time
        points:
          type: array
          items:
            $ref: "#/components/schemas/ForecastPoint"
    ErrorResponse:
      type: object
      properties:
        msg:
          type: string
        status:
          type: integer
        error:
          type: string
