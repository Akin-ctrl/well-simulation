openapi: 3.1.0
info:
  title: Wellhead Monitoring Public API
  version: 0.1.0
  summary: Dashboard-facing API for the wellhead monitoring simulation.
  description: |
    This contract documents the public API exposed by the TypeScript/Hono service.
    It covers monitoring, authentication, saved projections, synthetic control
    commands, and parameter proposals. Controls require current OPERATIONS
    authority; parameter publication requires ADMIN. No route controls field hardware.
servers:
  - url: /api
    description: Dashboard reverse-proxy path.
  - url: http://localhost:3000
    description: Local API service.
tags:
  - name: Health
  - name: Auth
  - name: Dashboard
  - name: Twin
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness check.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: API process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [Health]
      summary: Readiness check.
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: API process and required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: API process is running, but at least one required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /auth/register:
    post:
      tags: [Auth]
      summary: Create a dashboard user.
      description: |
        Requires an authenticated session holding the `user:manage` capability,
        which only the `ADMIN` role carries. Self-service registration was
        removed by ADR 0033: an unauthenticated write endpoint on an operations
        dashboard granted any caller a view of the whole fleet.

        Omitting `role` creates the least-privileged account.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate a dashboard user.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded and an HTTP-only session cookie was issued.
          headers:
            Set-Cookie:
              description: HTTP-only `auth_token` session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /auth/me:
    get:
      tags: [Auth]
      summary: Return the current authenticated user.
      operationId: getCurrentUser
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current session is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /auth/logout:
    post:
      tags: [Auth]
      summary: End every session of the signed-in user and clear the cookie.
      description: >-
        Moves the user's session version on (ADR 0037), so every session token
        issued so far is refused from then on, on any device. Requires a session.
      operationId: logoutUser
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logout succeeded. The session cookie is cleared.
          headers:
            Set-Cookie:
              description: Expired `auth_token` cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /dashboard/overview:
    get:
      tags: [Dashboard]
      summary: Return dashboard summary, recent readings, and active alarms.
      operationId: getDashboardOverview
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Recent readings from the historian view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /dashboard/latest-readings:
    get:
      tags: [Dashboard]
      summary: Return recent wellhead parameter readings.
      operationId: getLatestReadings
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Latest historian readings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestReadingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /dashboard/active-alarms:
    get:
      tags: [Dashboard]
      summary: Return totals over all active alarms and a capped, ranked list of them.
      operationId: getActiveAlarms
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active alarm events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveAlarmsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /dashboard/wellheads/{wellheadId}:
    get:
      tags: [Dashboard]
      summary: Return one wellhead with current readings, active alarms, and per-well trends.
      operationId: getWellheadDetail
      security:
        - cookieAuth: []
      parameters:
        - name: wellheadId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Wellhead detail data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellheadDetailResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ServerError"
        "500":
          $ref: "#/components/responses/ServerError"
  /dashboard/analytics:
    get:
      tags: [Dashboard]
      summary: Return aggregate trend data for analytics charts.
      operationId: getDashboardAnalytics
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Hourly and daily aggregate trend data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardAnalyticsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /twin/status:
    get:
      tags: [Twin]
      summary: Read lifecycle and successful process freshness, including partial startup.
      operationId: getTwinModelStatus
      security: [{cookieAuth: []}]
      responses:
        "200":
          description: Model state, or available false if its optional read failed.
          content:
            application/json:
              schema:
                type: object
                required: [data, msg, status]
                properties:
                  msg: {type: string}
                  status: {type: integer, const: 200}
                  data: {$ref: "#/components/schemas/FleetModelStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /twin/wellheads/{wellheadId}/runs:
    get:
      tags: [Twin]
      summary: List saved run summaries for one well, newest first.
      description: Shared with authorized dashboard readers. Metadata can outlive retained points.
      operationId: listTwinRuns
      security: [{cookieAuth: []}]
      parameters:
        - name: wellheadId
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: kind
          in: query
          schema: {type: string, enum: [forecast, scenario], default: scenario}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
      responses:
        "200":
          description: Bounded summary page with hasMore for pagination.
          content:
            application/json:
              schema:
                type: object
                required: [data, msg, status]
                properties:
                  msg: {type: string}
                  status: {type: integer, const: 200}
                  data:
                    type: object
                    required: [items, hasMore]
                    properties:
                      hasMore: {type: boolean}
                      items:
                        type: array
                        maxItems: 50
                        items: {$ref: "#/components/schemas/RunSummary"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /twin/wellheads/{wellheadId}/forecast:
    post:
      tags: [Twin]
      summary: Run and save a forecast from current synthetic model state.
      operationId: createTwinForecast
      security: [{cookieAuth: []}]
      parameters:
        - name: wellheadId
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ForecastRequest"}
      responses:
        "200":
          description: Forecast saved and returned in the standard API envelope.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectionEnvelope"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServerError"}
        "504": {$ref: "#/components/responses/ServerError"}
  /twin/scenarios:
    post:
      tags: [Twin]
      summary: Run and save a private control scenario with an unchanged baseline.
      operationId: createTwinScenario
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScenarioRequest"}
      responses:
        "200":
          description: Scenario saved and returned in the standard API envelope.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectionEnvelope"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServerError"}
        "504": {$ref: "#/components/responses/ServerError"}
  /twin/forecasts/{runId}:
    get:
      tags: [Twin]
      summary: Load a complete saved forecast.
      operationId: getTwinForecast
      security: [{cookieAuth: []}]
      parameters:
        - name: runId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Complete forecast with sampled points.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SavedProjectionEnvelope"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "404": {$ref: "#/components/responses/NotFound"}
        "410": {$ref: "#/components/responses/Gone"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /twin/scenarios/{runId}:
    get:
      tags: [Twin]
      summary: Load a complete saved scenario and baseline.
      operationId: getTwinScenario
      security: [{cookieAuth: []}]
      parameters:
        - name: runId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Complete scenario with sampled points.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SavedProjectionEnvelope"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "404": {$ref: "#/components/responses/NotFound"}
        "410": {$ref: "#/components/responses/Gone"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /twin/wellheads/{wellheadId}/controls:
    get:
      tags:
      - Twin
      summary: Read durable and running synthetic controls.
      operationId: getLiveControlState
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Durable status. A queued command is not yet applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlStateResponse'
        '400':
          description: Invalid JSON, target, or confirmation.
        '401':
          description: Missing or revoked session.
        '403':
          description: Current account lacks authority.
        '404':
          description: Unknown command or well.
        '409':
          description: Stale revision, conflicting proposal, or idempotency-key reuse.
        '429':
          description: More than ten writes per authenticated user per minute.
        '503':
          description: Dependency unavailable or commit outcome unknown. Read status
            or retry the same proposal; do not assume a write failed.
      parameters:
      - name: wellheadId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
  /twin/wellheads/{wellheadId}/control-commands:
    get:
      tags:
      - Twin
      summary: Read the current OPERATIONS user's proposals for one well.
      operationId: listOwnControlProposals
      security:
      - cookieAuth: []
      parameters:
      - name: wellheadId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      - name: idempotencyKey
        in: query
        description: Optional exact lookup for the current creator after a missing response.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: At most 20 own proposals, newest first. Does not require the
            model.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - msg
                - status
                properties:
                  msg:
                    type: string
                  status:
                    const: 200
                  data:
                    type: object
                    required:
                    - items
                    - offset
                    - hasMore
                    properties:
                      items:
                        type: array
                        maxItems: 20
                        items:
                          $ref: '#/components/schemas/ControlProposalSummary'
                      offset:
                        type: integer
                      hasMore:
                        type: boolean
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Database unavailable.
  /twin/wellheads/{wellheadId}/parameter-changes:
    get:
      tags:
      - Twin
      summary: Read the current ADMIN user's proposals for one well.
      operationId: listOwnParameterProposals
      security:
      - cookieAuth: []
      parameters:
      - name: wellheadId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      - name: idempotencyKey
        in: query
        description: Optional exact lookup for the current creator after a missing response.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: At most 20 own proposals, newest first. Does not require the
            model.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - msg
                - status
                properties:
                  msg:
                    type: string
                  status:
                    const: 200
                  data:
                    type: object
                    required:
                    - items
                    - offset
                    - hasMore
                    properties:
                      items:
                        type: array
                        maxItems: 20
                        items:
                          $ref: '#/components/schemas/ParameterChange'
                      offset:
                        type: integer
                      hasMore:
                        type: boolean
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Database unavailable.
  /twin/control-commands:
    post:
      tags:
      - Twin
      summary: Create an immutable OPERATIONS control draft.
      operationId: draftControlCommand
      security:
      - cookieAuth: []
      responses:
        '201':
          description: Durable status. A queued command is not yet applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlCommandResponse'
        '400':
          description: Invalid JSON, target, or confirmation.
        '401':
          description: Missing or revoked session.
        '403':
          description: Current account lacks authority.
        '404':
          description: Unknown command or well.
        '409':
          description: Stale revision, conflicting proposal, or idempotency-key reuse.
        '429':
          description: More than ten writes per authenticated user per minute.
        '503':
          description: Dependency unavailable or commit outcome unknown. Read status
            or retry the same proposal; do not assume a write failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlDraftRequest'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
  /twin/control-commands/{id}/activate:
    post:
      tags:
      - Twin
      summary: Explicitly activate the creator's command.
      operationId: activateControlCommand
      security:
      - cookieAuth: []
      responses:
        '202':
          description: Durable status. A queued command is not yet applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlCommandResponse'
        '400':
          description: Invalid JSON, target, or confirmation.
        '401':
          description: Missing or revoked session.
        '403':
          description: Current account lacks authority.
        '404':
          description: Unknown command or well.
        '409':
          description: Stale revision, conflicting proposal, or idempotency-key reuse.
        '429':
          description: More than ten writes per authenticated user per minute.
        '503':
          description: Dependency unavailable or commit outcome unknown. Read status
            or retry the same proposal; do not assume a write failed.
        '200':
          description: Repeated activation returns an existing terminal result without
            requeuing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlCommandResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlActivateRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /twin/control-commands/{id}/cancel:
    post:
      tags:
      - Twin
      summary: Cancel the creator's draft or queued command.
      operationId: cancelControlCommand
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Durable status. A queued command is not yet applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlCommandResponse'
        '400':
          description: Invalid JSON, target, or confirmation.
        '401':
          description: Missing or revoked session.
        '403':
          description: Current account lacks authority.
        '404':
          description: Unknown command or well.
        '409':
          description: Stale revision, conflicting proposal, or idempotency-key reuse.
        '429':
          description: More than ten writes per authenticated user per minute.
        '503':
          description: Dependency unavailable or commit outcome unknown. Read status
            or retry the same proposal; do not assume a write failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplicitConfirmation'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /twin/control-commands/{id}:
    get:
      tags:
      - Twin
      summary: Read command status and lifecycle events.
      operationId: getControlCommand
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Durable status. A queued command is not yet applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlCommandResponse'
        '400':
          description: Invalid JSON, target, or confirmation.
        '401':
          description: Missing or revoked session.
        '403':
          description: Current account lacks authority.
        '404':
          description: Unknown command or well.
        '409':
          description: Stale revision, conflicting proposal, or idempotency-key reuse.
        '429':
          description: More than ten writes per authenticated user per minute.
        '503':
          description: Dependency unavailable or commit outcome unknown. Read status
            or retry the same proposal; do not assume a write failed.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /twin/parameter-changes:
    post:
      tags:
      - Twin
      summary: Create an ADMIN parameter proposal.
      operationId: draftParameterChange
      security:
      - cookieAuth: []
      responses:
        '201':
          description: Durable status. A queued command is not yet applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterChangeResponse'
        '400':
          description: Invalid JSON, target, or confirmation.
        '401':
          description: Missing or revoked session.
        '403':
          description: Current account lacks authority.
        '404':
          description: Unknown command or well.
        '409':
          description: Stale revision, conflicting proposal, or idempotency-key reuse.
        '429':
          description: More than ten writes per authenticated user per minute.
        '503':
          description: Dependency unavailable or commit outcome unknown. Read status
            or retry the same proposal; do not assume a write failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParameterDraftRequest'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
  /twin/parameter-changes/{id}/publish:
    post:
      tags:
      - Twin
      summary: Publish an attributed override requiring restart.
      operationId: publishParameterChange
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Durable status. A queued command is not yet applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterChangeResponse'
        '400':
          description: Invalid JSON, target, or confirmation.
        '401':
          description: Missing or revoked session.
        '403':
          description: Current account lacks authority.
        '404':
          description: Unknown command or well.
        '409':
          description: Stale revision, conflicting proposal, or idempotency-key reuse.
        '429':
          description: More than ten writes per authenticated user per minute.
        '503':
          description: Dependency unavailable or commit outcome unknown. Read status
            or retry the same proposal; do not assume a write failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplicitConfirmation'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /twin/parameter-changes/{id}/cancel:
    post:
      tags:
      - Twin
      summary: Cancel the creator's parameter proposal.
      operationId: cancelParameterChange
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Durable status. A queued command is not yet applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterChangeResponse'
        '400':
          description: Invalid JSON, target, or confirmation.
        '401':
          description: Missing or revoked session.
        '403':
          description: Current account lacks authority.
        '404':
          description: Unknown command or well.
        '409':
          description: Stale revision, conflicting proposal, or idempotency-key reuse.
        '429':
          description: More than ten writes per authenticated user per minute.
        '503':
          description: Dependency unavailable or commit outcome unknown. Read status
            or retry the same proposal; do not assume a write failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplicitConfirmation'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /twin/parameter-changes/{id}:
    get:
      tags:
      - Twin
      summary: Read the proposal and the currently running parameter identity.
      operationId: getParameterChange
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Durable status. A queued command is not yet applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterChangeResponse'
        '400':
          description: Invalid JSON, target, or confirmation.
        '401':
          description: Missing or revoked session.
        '403':
          description: Current account lacks authority.
        '404':
          description: Unknown command or well.
        '409':
          description: Stale revision, conflicting proposal, or idempotency-key reuse.
        '429':
          description: More than ten writes per authenticated user per minute.
        '503':
          description: Dependency unavailable or commit outcome unknown. Read status
            or retry the same proposal; do not assume a write failed.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /twin/wellheads/{wellheadId}/parameters:
    get:
      tags: [Twin]
      summary: Read current override revision IDs and running model identity.
      operationId: getModelParameterStatus
      security: [{cookieAuth: []}]
      parameters:
        - name: wellheadId
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: ADMIN read with latestOverrides, modelVersion, status, and running controls (or null if unavailable).
          content:
            application/json:
              schema:
                type: object
                required: [data, msg, status]
                properties:
                  msg: {type: string}
                  status: {const: 200}
                  data:
                    type: object
                    required: [wellheadId, modelVersion, status, latestOverrides, running, catalogue]
                    properties:
                      wellheadId: {type: integer}
                      modelVersion: {type: string}
                      status: {type: string}
                      running:
                        anyOf:
                          - {$ref: '#/components/schemas/RunningControls'}
                          - {type: 'null'}
                      catalogue: {$ref: '#/components/schemas/ParameterCatalogue'}
                      latestOverrides:
                        type: array
                        items:
                          type: object
                          required: [parameterOverrideId, wellheadId, modelVersion, parameterKey, value, unit, source, changedBy, reason, validFrom]
                          properties:
                            parameterOverrideId: {type: integer}
                            wellheadId: {type: integer}
                            modelVersion: {type: string}
                            parameterKey: {type: string}
                            value: {type: [number, 'null']}
                            unit: {type: [string, 'null']}
                            source: {type: string}
                            changedBy: {type: string}
                            reason: {type: string}
                            validFrom: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {description: Model identity or database unavailable.}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
  responses:
    Unauthorized:
      description: Missing, invalid, or expired session token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: |
        The session is valid but the role lacks the capability this operation
        requires. See ADR 0033 for the permission matrix. The response does not
        state which roles would be permitted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested well or saved run does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Gone:
      description: Some or all saved points have expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Unexpected server-side error. Secrets and raw stack traces are not returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    LiveControlTargets:
      type: object
      required: []
      properties:
        chokePositionPercent:
          type: number
          minimum: 0
          maximum: 100
        masterValveOpen:
          type: boolean
        wingValveOpen:
          type: boolean
        pumpOn:
          type: boolean
        emergencyShutdown:
          type: boolean
      additionalProperties: false
      minProperties: 1
      description: Absolute targets. Missing fields keep their value; null is invalid.
        Shutdown and reset each require a command containing only emergencyShutdown. While
        shutdown is active, other changes are refused.
    RunningControls:
      type: object
      required:
      - wellheadId
      - revision
      - modelVersion
      - parameterFingerprint
      - status
      - lastTickAt
      - controls
      properties:
        wellheadId:
          type: integer
          minimum: 1
          maximum: 2147483647
        revision:
          type: integer
          minimum: 0
          maximum: 2147483646
        modelVersion:
          type: string
        parameterFingerprint:
          type: string
          minLength: 64
          maxLength: 64
        status:
          type: string
        lastTickAt:
          type:
          - string
          - 'null'
          format: date-time
        controls:
          type: object
          required:
          - chokePositionPercent
          - masterValveOpen
          - wingValveOpen
          - pumpOn
          - emergencyShutdown
          - swabValveOpen
          properties:
            chokePositionPercent:
              type: number
              minimum: 0
              maximum: 100
            masterValveOpen:
              type: boolean
            wingValveOpen:
              type: boolean
            pumpOn:
              type: boolean
            emergencyShutdown:
              type: boolean
            swabValveOpen:
              type: boolean
          additionalProperties: false
      additionalProperties: false
    ControlDraftRequest:
      type: object
      required:
      - wellheadId
      - expectedRevision
      - reason
      - targets
      properties:
        wellheadId:
          type: integer
          minimum: 1
          maximum: 2147483647
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 2147483646
        reason:
          type: string
          minLength: 1
          maxLength: 500
        targets:
          $ref: '#/components/schemas/LiveControlTargets'
      additionalProperties: false
    ControlActivateRequest:
      type: object
      required:
      - confirm
      - expectedRevision
      properties:
        confirm:
          const: true
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 2147483646
      additionalProperties: false
    ExplicitConfirmation:
      type: object
      required:
      - confirm
      properties:
        confirm:
          const: true
      additionalProperties: false
    ControlCommand:
      type: object
      required:
      - commandId
      - wellheadId
      - createdBy
      - idempotencyKey
      - reason
      - expectedRevision
      - modelVersion
      - parameterFingerprint
      - chokePositionPercent
      - masterValveOpen
      - wingValveOpen
      - pumpOn
      - emergencyShutdown
      - status
      - createdAt
      - expiresAt
      - queuedAt
      - activatedBy
      - activatedRole
      - activatedSessionVersion
      - resultAt
      - resultRevision
      - resultReason
      - requestId
      properties:
        commandId:
          type: string
          format: uuid
        wellheadId:
          type: integer
          minimum: 1
          maximum: 2147483647
        createdBy:
          type: integer
          minimum: 1
          maximum: 2147483647
        idempotencyKey:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 500
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 2147483646
        modelVersion:
          type: string
        parameterFingerprint:
          type: string
        chokePositionPercent:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
        masterValveOpen:
          type:
          - boolean
          - 'null'
        wingValveOpen:
          type:
          - boolean
          - 'null'
        pumpOn:
          type:
          - boolean
          - 'null'
        emergencyShutdown:
          type:
          - boolean
          - 'null'
        status:
          type: string
          enum:
          - draft
          - queued
          - applied
          - rejected
          - expired
          - cancelled
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        queuedAt:
          type:
          - string
          - 'null'
          format: date-time
        activatedBy:
          type:
          - integer
          - 'null'
        activatedRole:
          type:
          - string
          - 'null'
        activatedSessionVersion:
          type:
          - integer
          - 'null'
        resultAt:
          type:
          - string
          - 'null'
          format: date-time
        resultRevision:
          type:
          - integer
          - 'null'
        resultReason:
          type:
          - string
          - 'null'
        requestId:
          type:
          - string
          - 'null'
        events:
          type: array
          items:
            type: object
            required:
            - eventId
            - commandId
            - eventType
            - occurredAt
            - actorUserId
            - reasonCode
            - requestId
            properties:
              eventId:
                type: integer
                minimum: 1
                maximum: 2147483647
              commandId:
                type: string
                format: uuid
              eventType:
                type: string
              occurredAt:
                type: string
                format: date-time
              actorUserId:
                type:
                - integer
                - 'null'
              reasonCode:
                type: string
              requestId:
                type:
                - string
                - 'null'
        notificationPending:
          type: boolean
    ParameterCatalogue:
      type: object
      required:
      - wellheadId
      - modelVersion
      - parameters
      properties:
        wellheadId:
          type: integer
          minimum: 1
        modelVersion:
          type: string
        parameters:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required:
            - key
            - description
            - unit
            - defaultValue
            - minimum
            - maximum
            - requiresRestart
            - runningValue
            properties:
              key:
                type: string
              description:
                type: string
              unit:
                type: string
              defaultValue:
                type: number
              minimum:
                type: number
              maximum:
                type: number
              requiresRestart:
                type: boolean
              runningValue:
                type:
                - number
                - 'null'
    ControlProposalSummary:
      type: object
      required:
      - commandId
      - wellheadId
      - createdBy
      - idempotencyKey
      - reason
      - expectedRevision
      - modelVersion
      - chokePositionPercent
      - masterValveOpen
      - wingValveOpen
      - pumpOn
      - emergencyShutdown
      - status
      - createdAt
      - expiresAt
      - resultAt
      - resultRevision
      - resultReason
      properties:
        commandId:
          type: string
          format: uuid
        wellheadId:
          type: integer
          minimum: 1
          maximum: 2147483647
        createdBy:
          type: integer
          minimum: 1
          maximum: 2147483647
        idempotencyKey:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 500
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 2147483646
        modelVersion:
          type: string
        chokePositionPercent:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
        masterValveOpen:
          type:
          - boolean
          - 'null'
        wingValveOpen:
          type:
          - boolean
          - 'null'
        pumpOn:
          type:
          - boolean
          - 'null'
        emergencyShutdown:
          type:
          - boolean
          - 'null'
        status:
          type: string
          enum:
          - draft
          - queued
          - applied
          - rejected
          - expired
          - cancelled
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        resultAt:
          type:
          - string
          - 'null'
          format: date-time
        resultRevision:
          type:
          - integer
          - 'null'
        resultReason:
          type:
          - string
          - 'null'
    ParameterDraftRequest:
      type: object
      required:
      - wellheadId
      - modelVersion
      - parameterKey
      - value
      - unit
      - expectedOverrideId
      - reason
      properties:
        wellheadId:
          type: integer
          minimum: 1
          maximum: 2147483647
        modelVersion:
          type: string
          pattern: ^\d+\.\d+\.\d+$
        parameterKey:
          type: string
          minLength: 1
          maxLength: 100
        value:
          type:
          - number
          - 'null'
        unit:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 40
        expectedOverrideId:
          type:
          - integer
          - 'null'
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 500
      additionalProperties: false
      description: Null value and unit together remove an override. Ranges and units are
        validated by twin-core.
    ParameterChange:
      type: object
      required:
      - changeId
      - wellheadId
      - createdBy
      - idempotencyKey
      - modelVersion
      - parameterKey
      - value
      - unit
      - reason
      - expectedOverrideId
      - status
      - createdAt
      - expiresAt
      - resultAt
      - publishedOverrideId
      properties:
        changeId:
          type: string
          format: uuid
        wellheadId:
          type: integer
          minimum: 1
          maximum: 2147483647
        createdBy:
          type: integer
          minimum: 1
          maximum: 2147483647
        idempotencyKey:
          type: string
          format: uuid
        modelVersion:
          type: string
        parameterKey:
          type: string
        value:
          type:
          - number
          - 'null'
        unit:
          type:
          - string
          - 'null'
        reason:
          type: string
        expectedOverrideId:
          type:
          - integer
          - 'null'
        status:
          type: string
          enum:
          - draft
          - published
          - cancelled
          - expired
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        resultAt:
          type:
          - string
          - 'null'
          format: date-time
        publishedOverrideId:
          type:
          - integer
          - 'null'
        restartRequired:
          type: boolean
        notificationPending:
          type: boolean
        running:
          anyOf:
          - $ref: '#/components/schemas/RunningControls'
          - type: 'null'
    ControlState:
      type: object
      required:
      - active
      - running
      - pendingCommandId
      properties:
        active:
          anyOf:
          - type: object
            required:
            - wellheadId
            - revision
            - modelVersion
            - parameterFingerprint
            - chokePositionPercent
            - masterValveOpen
            - wingValveOpen
            - pumpOn
            - emergencyShutdown
            - swabValveOpen
            - appliedCommandId
            - appliedAt
            properties:
              wellheadId:
                type: integer
                minimum: 1
                maximum: 2147483647
              revision:
                type: integer
                minimum: 0
                maximum: 2147483646
              modelVersion:
                type: string
              parameterFingerprint:
                type: string
              chokePositionPercent:
                type: number
                minimum: 0
                maximum: 100
              masterValveOpen:
                type: boolean
              wingValveOpen:
                type: boolean
              pumpOn:
                type: boolean
              emergencyShutdown:
                type: boolean
              swabValveOpen:
                type: boolean
              appliedCommandId:
                type:
                - string
                - 'null'
                format: uuid
              appliedAt:
                type: string
                format: date-time
          - type: 'null'
        running:
          $ref: '#/components/schemas/RunningControls'
        pendingCommandId:
          type:
          - string
          - 'null'
          format: uuid
    ControlCommandResponse:
      type: object
      required:
      - data
      - msg
      - status
      properties:
        data:
          $ref: '#/components/schemas/ControlCommand'
        msg:
          type: string
        status:
          type: integer
    ParameterChangeResponse:
      type: object
      required:
      - data
      - msg
      - status
      properties:
        data:
          $ref: '#/components/schemas/ParameterChange'
        msg:
          type: string
        status:
          type: integer
    ControlStateResponse:
      type: object
      required:
      - data
      - msg
      - status
      properties:
        data:
          $ref: '#/components/schemas/ControlState'
        msg:
          type: string
        status:
          type: integer
    ForecastRequest:
      type: object
      additionalProperties: false
      properties:
        horizonSeconds: {type: integer, minimum: 300, maximum: 7200, default: 1800}
        stepSeconds: {type: integer, minimum: 5, maximum: 300, default: 60}
      description: Horizon must be divisible by step size.
    ScenarioRequest:
      type: object
      additionalProperties: false
      required: [wellheadId, name, controls]
      properties:
        wellheadId: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 120}
        horizonSeconds: {type: integer, minimum: 300, maximum: 7200, default: 1800}
        stepSeconds: {type: integer, minimum: 5, maximum: 300, default: 60}
        controls:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [offsetMinutes, input]
            properties:
              offsetMinutes: {type: integer, minimum: 0}
              input:
                type: object
                additionalProperties: false
                minProperties: 1
                properties:
                  chokePositionPercent: {type: number, minimum: 0, maximum: 100}
                  masterValveOpen: {type: boolean}
                  wingValveOpen: {type: boolean}
                  pumpOn: {type: boolean}
                  emergencyShutdown: {type: boolean}
      description: Control offsets must increase and stay inside the horizon.
    FleetModelStatus:
      type: object
      required: [checkedAt, available, wellheads]
      properties:
        checkedAt: {type: string, format: date-time}
        available: {type: boolean}
        wellheads:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [wellheadId, modelVersion, status, reason, lastTickAt,
              simulatedAt, processAgeSeconds, current, skippedTicks, restoredFrom,
              lastRecoveryEvent]
            properties:
              wellheadId: {type: integer, minimum: 1}
              modelVersion: {type: string}
              status: {type: string}
              reason: {type: string}
              lastTickAt: {type: [string, "null"], format: date-time}
              simulatedAt: {type: [string, "null"], format: date-time}
              processAgeSeconds: {type: [number, "null"]}
              current: {type: boolean}
              skippedTicks: {type: integer, minimum: 0}
              restoredFrom: {type: [string, "null"], format: date-time}
              lastRecoveryEvent:
                type: [object, "null"]
                required: [type, time]
                properties:
                  type: {type: string}
                  time: {type: string, format: date-time}
    RunSummary:
      type: object
      required: [runId, kind, wellheadId, name, createdAt, baseSimulatedAt,
        modelVersion, horizonSeconds, stepSeconds, confidenceScore]
      properties:
        runId: {type: string, format: uuid}
        kind: {type: string, enum: [forecast, scenario]}
        wellheadId: {type: integer, minimum: 1}
        name: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
        baseSimulatedAt: {type: string, format: date-time}
        modelVersion: {type: string}
        horizonSeconds: {type: integer}
        stepSeconds: {type: integer}
        confidenceScore: {type: number, minimum: 0, maximum: 1}
    SavedProjectionEnvelope:
      allOf:
        - {$ref: "#/components/schemas/ProjectionEnvelope"}
        - type: object
          properties:
            data:
              type: object
              required: [baselineControls, scheduledControls, signals]
              properties:
                baselineControls:
                  type: object
                  description: Original model control values, using persisted field names.
                  additionalProperties: {type: [number, boolean]}
                scheduledControls:
                  type: array
                  items: {$ref: "#/components/schemas/ScenarioRequest/properties/controls/items"}
                signals:
                  type: array
                  items:
                    type: object
                    required: [code, displayName, canonicalUnit, dataType]
                    properties:
                      code: {type: string}
                      displayName: {type: string}
                      canonicalUnit: {type: [string, "null"]}
                      dataType: {type: string}
    ProjectionEnvelope:
      type: object
      required: [msg, data, status]
      properties:
        msg: {type: string}
        status: {type: integer, const: 200}
        data:
          type: object
          required: [runId, kind, wellheadId, source, fieldCalibrated, modelVersion,
            baseSimulatedAt, generatedAt, horizonSeconds, stepSeconds,
            confidence, points]
          properties:
            runId: {type: string, format: uuid}
            kind: {type: string, enum: [forecast, scenario]}
            wellheadId: {type: integer, minimum: 1}
            name: {type: [string, "null"]}
            source: {type: string, const: synthetic_reduced_order_model}
            fieldCalibrated: {type: boolean, const: false}
            modelVersion: {type: string}
            baseSimulatedAt: {type: string, format: date-time}
            generatedAt: {type: string, format: date-time}
            horizonSeconds: {type: integer}
            stepSeconds: {type: integer}
            confidence:
              type: object
              required: [method, score, label, reasons]
              properties:
                method: {type: string, const: heuristic_uncalibrated}
                score: {type: number, minimum: 0, maximum: 1}
                label: {type: string, enum: [moderate, low]}
                reasons:
                  type: array
                  items: {type: string}
            points:
              type: array
              minItems: 1
              maxItems: 1440
              items:
                type: object
                required: [elapsedSeconds, timestamp, values, alarmRisk,
                  triggeredRuleIds]
                properties:
                  elapsedSeconds: {type: integer, minimum: 1}
                  timestamp: {type: string, format: date-time}
                  values:
                    type: object
                    additionalProperties: {type: number}
                  alarmRisk: {type: string, enum: [none, warning, critical, unknown]}
                  triggeredRuleIds:
                    type: array
                    items: {type: integer}
                  baselineValues:
                    type: object
                    additionalProperties: {type: number}
                  baselineAlarmRisk:
                    type: string
                    enum: [none, warning, critical, unknown]
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: api
        timestamp:
          type: string
          format: date-time
    ReadinessResponse:
      type: object
      required: [status, service, dependencies, timestamp]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        service:
          type: string
          const: api
        dependencies:
          type: object
          required: [database]
          properties:
            database:
              type: string
              enum: [ready, unavailable]
        timestamp:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [username, email, password, confirmPassword]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        username:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          writeOnly: true
        confirmPassword:
          type: string
          minLength: 12
          writeOnly: true
        role:
          description: |
            Role for the new account. Defaults to `USER` when omitted. See
            ADR 0033: `ADMIN` does not inherit `OPERATIONS`.
          type: string
          enum: [USER, OPERATIONS, ADMIN]
          default: USER
    LoginRequest:
      type: object
      required: [emailOrUsername, password]
      properties:
        emailOrUsername:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 12
          writeOnly: true
    AuthUserResponse:
      type: object
      required: [msg, data, status]
      properties:
        msg:
          type: string
        status:
          type: integer
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: "#/components/schemas/PublicUser"
    LogoutResponse:
      type: object
      required: [msg, data, status]
      properties:
        msg:
          type: string
          const: Logged out
        status:
          type: integer
        data:
          type: object
          required: [authenticated]
          properties:
            authenticated:
              type: boolean
              const: false
    PublicUser:
      type: object
      description: User object with password hash intentionally omitted.
      properties:
        id:
          type: integer
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        userName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        status:
          type: string
        createdAt:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: [string, "null"]
          format: date-time
    DashboardOverviewResponse:
      type: object
      required: [msg, data, status]
      properties:
        msg:
          type: string
        status:
          type: integer
        data:
          $ref: "#/components/schemas/DashboardOverviewData"
    DashboardOverviewData:
      type: object
      required: [summary, latestReadings, activeAlarms, wellheads]
      properties:
        wellheads:
          type: array
          items:
            allOf:
              - {$ref: "#/components/schemas/WellheadAsset"}
              - type: object
                required: [activeAlarmCount]
                properties:
                  activeAlarmCount: {type: integer, minimum: 0}
        summary:
          $ref: "#/components/schemas/DashboardSummary"
        latestReadings:
          type: array
          items:
            $ref: "#/components/schemas/WellheadReading"
        activeAlarms:
          type: array
          items:
            $ref: "#/components/schemas/ActiveAlarm"
    LatestReadingsResponse:
      type: object
      required: [msg, data, status]
      properties:
        msg:
          type: string
        status:
          type: integer
        data:
          type: object
          required: [readings]
          properties:
            readings:
              type: array
              items:
                $ref: "#/components/schemas/WellheadReading"
    ActiveAlarmsResponse:
      type: object
      required: [msg, data, status]
      properties:
        msg:
          type: string
        status:
          type: integer
        data:
          type: object
          required: [totals, alarms]
          properties:
            totals:
              $ref: "#/components/schemas/ActiveAlarmTotals"
            alarms:
              type: array
              description: >-
                At most 50 active alarms, most severe first and then oldest
                first. It can hold fewer rows than totals.total.
              maxItems: 50
              items:
                $ref: "#/components/schemas/ActiveAlarm"
    ActiveAlarmTotals:
      type: object
      description: Counts over every active alarm, not only the listed ones.
      required: [total, critical, warning, affectedWellheads]
      properties:
        total:
          type: integer
          minimum: 0
        critical:
          type: integer
          minimum: 0
        warning:
          type: integer
          minimum: 0
        affectedWellheads:
          type: integer
          minimum: 0
    DashboardAnalyticsResponse:
      type: object
      required: [msg, data, status]
      properties:
        msg:
          type: string
        status:
          type: integer
        data:
          type: object
          required:
            - pressureTrend
            - temperatureFlowTrend
            - waterCutGorTrend
            - alarmCounts
          properties:
            pressureTrend:
              type: array
              items:
                $ref: "#/components/schemas/AggregateTrendPoint"
            temperatureFlowTrend:
              type: array
              items:
                $ref: "#/components/schemas/AggregateTrendPoint"
            waterCutGorTrend:
              type: array
              items:
                $ref: "#/components/schemas/AggregateTrendPoint"
            alarmCounts:
              type: array
              description: One total per severity over the last 24 hours.
              items:
                $ref: "#/components/schemas/AlarmCount"
    WellheadDetailResponse:
      type: object
      required: [msg, data, status]
      properties:
        msg:
          type: string
        status:
          type: integer
        data:
          type: object
          required:
            - wellhead
            - latestReadingAgeSeconds
            - latestReadingAt
            - latestReadings
            - activeAlarms
            - pressureTrend
            - temperatureFlowTrend
            - waterCutGorTrend
          properties:
            wellhead:
              $ref: "#/components/schemas/WellheadAsset"
            latestReadingAgeSeconds: {type: [number, "null"], minimum: 0}
            latestReadingAt:
              type: [string, "null"]
              format: date-time
            latestReadings:
              type: array
              items:
                $ref: "#/components/schemas/WellheadReading"
            activeAlarms:
              type: array
              items:
                $ref: "#/components/schemas/ActiveAlarm"
            pressureTrend:
              type: array
              items:
                $ref: "#/components/schemas/AggregateTrendPoint"
            temperatureFlowTrend:
              type: array
              items:
                $ref: "#/components/schemas/AggregateTrendPoint"
            waterCutGorTrend:
              type: array
              items:
                $ref: "#/components/schemas/AggregateTrendPoint"
    WellheadAsset:
      type: object
      required:
        - wellheadId
        - wellheadName
        - locationId
        - locationName
        - fieldId
        - fieldName
      properties:
        wellheadId:
          type: integer
        wellheadName:
          type: string
        wellheadType:
          type: [string, "null"]
        status:
          type: [string, "null"]
        locationId:
          type: integer
        locationName:
          type: string
        fieldId:
          type: integer
        fieldName:
          type: string
    DashboardSummary:
      type: object
      required: [totalWellheads, parametersTracked, activeAlarms, latestReadingAt, latestReadingAgeSeconds]
      properties:
        totalWellheads:
          type: integer
        parametersTracked:
          type: integer
        activeAlarms:
          type: integer
        latestReadingAgeSeconds: {type: [number, "null"], minimum: 0}
        latestReadingAt:
          type: [string, "null"]
          format: date-time
    WellheadReading:
      type: object
      description: Row returned from the wellhead parameter readings view.
      properties:
        timestampUtc:
          type: [string, "null"]
          format: date-time
        rawValue:
          type: [number, "null"]
        wellheadId:
          type: [integer, "null"]
        wellheadName:
          type: string
        wellheadType:
          type: [string, "null"]
        locationName:
          type: [string, "null"]
        fieldName:
          type: [string, "null"]
        parameterCode:
          type: [string, "null"]
        parameterDisplayName:
          type: string
        canonicalUnit:
          type: [string, "null"]
        dataType:
          type: [string, "null"]
        normalMin:
          type: [number, "null"]
        normalMax:
          type: [number, "null"]
    ActiveAlarm:
      type: object
      description: Active alarm event from the alarm view.
      properties:
        eventId:
          type: [integer, "null"]
        triggeredAt:
          type: [string, "null"]
          format: date-time
        severityLevel:
          type: [string, "null"]
        triggeredValue:
          type: [number, "null"]
        wellheadId:
          type: [integer, "null"]
        wellheadName:
          type: [string, "null"]
        locationName:
          type: [string, "null"]
        fieldName:
          type: [string, "null"]
        parameterCode:
          type: [string, "null"]
        parameterDisplayName:
          type: [string, "null"]
        canonicalUnit:
          type: [string, "null"]
        operator:
          type: [string, "null"]
        thresholdValue:
          type: [number, "null"]
        alarmRuleId:
          type: [integer, "null"]
    AggregateTrendPoint:
      type: object
      description: Two-minute aggregate trend point from a TimescaleDB continuous aggregate.
      properties:
        bucketTime:
          type: [string, "null"]
          format: date-time
        parameterCode:
          type: [string, "null"]
        parameterDisplayName:
          type: [string, "null"]
        canonicalUnit:
          type: [string, "null"]
        avgValue:
          type: [number, "null"]
        minValue:
          type: [number, "null"]
        maxValue:
          type: [number, "null"]
        readingCount:
          type: [integer, "null"]
    AlarmCount:
      type: object
      description: Alarms triggered in the last 24 hours for one severity.
      required: [severityLevel, alarmsTriggered]
      properties:
        severityLevel:
          type: [string, "null"]
        alarmsTriggered:
          type: integer
          minimum: 0
    ErrorResponse:
      type: object
      properties:
        msg:
          type: string
        status:
          type: integer
        error:
          type: string
        hint:
          type: string
