openapi: 3.1.0
info:
  title: Wellhead Monitoring Public API
  version: 0.1.0
  summary: Dashboard-facing API for the wellhead monitoring simulation.
  description: |
    This contract documents the public API exposed by the TypeScript/Hono service.
    It covers the currently implemented dashboard/auth surface and keeps the
    digital-twin evolution honest: twin-core endpoints belong in the internal
    contract until they are implemented.
servers:
  - url: /api
    description: Dashboard reverse-proxy path.
  - url: http://localhost:3000
    description: Local API service.
tags:
  - name: Health
  - name: Auth
  - name: Dashboard
  - name: Twin
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness check.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: API process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [Health]
      summary: Readiness check.
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: API process and required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: API process is running, but at least one required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /auth/register:
    post:
      tags: [Auth]
      summary: Create a dashboard user.
      description: |
        Requires an authenticated session holding the `user:manage` capability,
        which only the `ADMIN` role carries. Self-service registration was
        removed by ADR 0033: an unauthenticated write endpoint on an operations
        dashboard granted any caller a view of the whole fleet.

        Omitting `role` creates the least-privileged account.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate a dashboard user.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded and an HTTP-only session cookie was issued.
          headers:
            Set-Cookie:
              description: HTTP-only `auth_token` session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /auth/me:
    get:
      tags: [Auth]
      summary: Return the current authenticated user.
      operationId: getCurrentUser
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current session is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /auth/logout:
    post:
      tags: [Auth]
      summary: End every session of the signed-in user and clear the cookie.
      description: >-
        Moves the user's session version on (ADR 0037), so every session token
        issued so far is refused from then on, on any device. Requires a session.
      operationId: logoutUser
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logout succeeded. The session cookie is cleared.
          headers:
            Set-Cookie:
              description: Expired `auth_token` cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /dashboard/overview:
    get:
      tags: [Dashboard]
      summary: Return dashboard summary, recent readings, and active alarms.
      operationId: getDashboardOverview
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Recent readings from the historian view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /dashboard/latest-readings:
    get:
      tags: [Dashboard]
      summary: Return recent wellhead parameter readings.
      operationId: getLatestReadings
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Latest historian readings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestReadingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /dashboard/active-alarms:
    get:
      tags: [Dashboard]
      summary: Return totals over all active alarms and a capped, ranked list of them.
      operationId: getActiveAlarms
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active alarm events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveAlarmsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /dashboard/wellheads/{wellheadId}:
    get:
      tags: [Dashboard]
      summary: Return one wellhead with current readings, active alarms, and per-well trends.
      operationId: getWellheadDetail
      security:
        - cookieAuth: []
      parameters:
        - name: wellheadId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Wellhead detail data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellheadDetailResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ServerError"
        "500":
          $ref: "#/components/responses/ServerError"
  /dashboard/analytics:
    get:
      tags: [Dashboard]
      summary: Return aggregate trend data for analytics charts.
      operationId: getDashboardAnalytics
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Hourly and daily aggregate trend data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardAnalyticsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /twin/wellheads/{wellheadId}/forecast:
    post:
      tags: [Twin]
      summary: Run and save a forecast from current synthetic model state.
      operationId: createTwinForecast
      security: [{cookieAuth: []}]
      parameters:
        - name: wellheadId
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ForecastRequest"}
      responses:
        "200":
          description: Forecast saved and returned in the standard API envelope.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectionEnvelope"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServerError"}
        "504": {$ref: "#/components/responses/ServerError"}
  /twin/scenarios:
    post:
      tags: [Twin]
      summary: Run and save a private control scenario with an unchanged baseline.
      operationId: createTwinScenario
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScenarioRequest"}
      responses:
        "200":
          description: Scenario saved and returned in the standard API envelope.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectionEnvelope"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServerError"}
        "504": {$ref: "#/components/responses/ServerError"}
  /twin/forecasts/{runId}:
    get:
      tags: [Twin]
      summary: Load a complete saved forecast.
      operationId: getTwinForecast
      security: [{cookieAuth: []}]
      parameters:
        - name: runId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Complete forecast with sampled points.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectionEnvelope"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "404": {$ref: "#/components/responses/NotFound"}
        "410": {$ref: "#/components/responses/Gone"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /twin/scenarios/{runId}:
    get:
      tags: [Twin]
      summary: Load a complete saved scenario and baseline.
      operationId: getTwinScenario
      security: [{cookieAuth: []}]
      parameters:
        - name: runId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Complete scenario with sampled points.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectionEnvelope"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "404": {$ref: "#/components/responses/NotFound"}
        "410": {$ref: "#/components/responses/Gone"}
        "401": {$ref: "#/components/responses/Unauthorized"}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
  responses:
    Unauthorized:
      description: Missing, invalid, or expired session token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: |
        The session is valid but the role lacks the capability this operation
        requires. See ADR 0033 for the permission matrix. The response does not
        state which roles would be permitted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested well or saved run does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Gone:
      description: Some or all saved points have expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Unexpected server-side error. Secrets and raw stack traces are not returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ForecastRequest:
      type: object
      additionalProperties: false
      properties:
        horizonSeconds: {type: integer, minimum: 300, maximum: 7200, default: 1800}
        stepSeconds: {type: integer, minimum: 5, maximum: 300, default: 60}
      description: Horizon must be divisible by step size.
    ScenarioRequest:
      type: object
      additionalProperties: false
      required: [wellheadId, name, controls]
      properties:
        wellheadId: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 120}
        horizonSeconds: {type: integer, minimum: 300, maximum: 7200, default: 1800}
        stepSeconds: {type: integer, minimum: 5, maximum: 300, default: 60}
        controls:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [offsetMinutes, input]
            properties:
              offsetMinutes: {type: integer, minimum: 0}
              input:
                type: object
                additionalProperties: false
                minProperties: 1
                properties:
                  chokePositionPercent: {type: number, minimum: 0, maximum: 100}
                  masterValveOpen: {type: boolean}
                  wingValveOpen: {type: boolean}
                  pumpOn: {type: boolean}
                  emergencyShutdown: {type: boolean}
      description: Control offsets must increase and stay inside the horizon.
    ProjectionEnvelope:
      type: object
      required: [msg, data, status]
      properties:
        msg: {type: string}
        status: {type: integer, const: 200}
        data:
          type: object
          required: [runId, kind, wellheadId, source, fieldCalibrated, modelVersion,
            baseSimulatedAt, generatedAt, horizonSeconds, stepSeconds,
            confidence, points]
          properties:
            runId: {type: string, format: uuid}
            kind: {type: string, enum: [forecast, scenario]}
            wellheadId: {type: integer, minimum: 1}
            name: {type: [string, "null"]}
            source: {type: string, const: synthetic_reduced_order_model}
            fieldCalibrated: {type: boolean, const: false}
            modelVersion: {type: string}
            baseSimulatedAt: {type: string, format: date-time}
            generatedAt: {type: string, format: date-time}
            horizonSeconds: {type: integer}
            stepSeconds: {type: integer}
            confidence:
              type: object
              required: [method, score, label, reasons]
              properties:
                method: {type: string, const: heuristic_uncalibrated}
                score: {type: number, minimum: 0, maximum: 1}
                label: {type: string, enum: [moderate, low]}
                reasons:
                  type: array
                  items: {type: string}
            points:
              type: array
              minItems: 1
              maxItems: 1440
              items:
                type: object
                required: [elapsedSeconds, timestamp, values, alarmRisk,
                  triggeredRuleIds]
                properties:
                  elapsedSeconds: {type: integer, minimum: 1}
                  timestamp: {type: string, format: date-time}
                  values:
                    type: object
                    additionalProperties: {type: number}
                  alarmRisk: {type: string, enum: [none, warning, critical, unknown]}
                  triggeredRuleIds:
                    type: array
                    items: {type: integer}
                  baselineValues:
                    type: object
                    additionalProperties: {type: number}
                  baselineAlarmRisk:
                    type: string
                    enum: [none, warning, critical, unknown]
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: api
        timestamp:
          type: string
          format: date-time
    ReadinessResponse:
      type: object
      required: [status, service, dependencies, timestamp]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        service:
          type: string
          const: api
        dependencies:
          type: object
          required: [database]
          properties:
            database:
              type: string
              enum: [ready, unavailable]
        timestamp:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [username, email, password, confirmPassword]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        username:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          writeOnly: true
        confirmPassword:
          type: string
          minLength: 12
          writeOnly: true
        role:
          description: |
            Role for the new account. Defaults to `USER` when omitted. See
            ADR 0033: `ADMIN` does not inherit `OPERATIONS`.
          type: string
          enum: [USER, OPERATIONS, ADMIN]
          default: USER
    LoginRequest:
      type: object
      required: [emailOrUsername, password]
      properties:
        emailOrUsername:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 12
          writeOnly: true
    AuthUserResponse:
      type: object
      required: [msg, data, status]
      properties:
        msg:
          type: string
        status:
          type: integer
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: "#/components/schemas/PublicUser"
    LogoutResponse:
      type: object
      required: [msg, data, status]
      properties:
        msg:
          type: string
          const: Logged out
        status:
          type: integer
        data:
          type: object
          required: [authenticated]
          properties:
            authenticated:
              type: boolean
              const: false
    PublicUser:
      type: object
      description: User object with password hash intentionally omitted.
      properties:
        id:
          type: integer
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        userName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        status:
          type: string
        createdAt:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: [string, "null"]
          format: date-time
    DashboardOverviewResponse:
      type: object
      required: [msg, data, status]
      properties:
        msg:
          type: string
        status:
          type: integer
        data:
          $ref: "#/components/schemas/DashboardOverviewData"
    DashboardOverviewData:
      type: object
      required: [summary, latestReadings, activeAlarms]
      properties:
        summary:
          $ref: "#/components/schemas/DashboardSummary"
        latestReadings:
          type: array
          items:
            $ref: "#/components/schemas/WellheadReading"
        activeAlarms:
          type: array
          items:
            $ref: "#/components/schemas/ActiveAlarm"
    LatestReadingsResponse:
      type: object
      required: [msg, data, status]
      properties:
        msg:
          type: string
        status:
          type: integer
        data:
          type: object
          required: [readings]
          properties:
            readings:
              type: array
              items:
                $ref: "#/components/schemas/WellheadReading"
    ActiveAlarmsResponse:
      type: object
      required: [msg, data, status]
      properties:
        msg:
          type: string
        status:
          type: integer
        data:
          type: object
          required: [totals, alarms]
          properties:
            totals:
              $ref: "#/components/schemas/ActiveAlarmTotals"
            alarms:
              type: array
              description: >-
                At most 50 active alarms, most severe first and then oldest
                first. It can hold fewer rows than totals.total.
              maxItems: 50
              items:
                $ref: "#/components/schemas/ActiveAlarm"
    ActiveAlarmTotals:
      type: object
      description: Counts over every active alarm, not only the listed ones.
      required: [total, critical, warning, affectedWellheads]
      properties:
        total:
          type: integer
          minimum: 0
        critical:
          type: integer
          minimum: 0
        warning:
          type: integer
          minimum: 0
        affectedWellheads:
          type: integer
          minimum: 0
    DashboardAnalyticsResponse:
      type: object
      required: [msg, data, status]
      properties:
        msg:
          type: string
        status:
          type: integer
        data:
          type: object
          required:
            - pressureTrend
            - temperatureFlowTrend
            - waterCutGorTrend
            - alarmCounts
          properties:
            pressureTrend:
              type: array
              items:
                $ref: "#/components/schemas/AggregateTrendPoint"
            temperatureFlowTrend:
              type: array
              items:
                $ref: "#/components/schemas/AggregateTrendPoint"
            waterCutGorTrend:
              type: array
              items:
                $ref: "#/components/schemas/AggregateTrendPoint"
            alarmCounts:
              type: array
              description: One total per severity over the last 24 hours.
              items:
                $ref: "#/components/schemas/AlarmCount"
    WellheadDetailResponse:
      type: object
      required: [msg, data, status]
      properties:
        msg:
          type: string
        status:
          type: integer
        data:
          type: object
          required:
            - wellhead
            - latestReadingAt
            - latestReadings
            - activeAlarms
            - pressureTrend
            - temperatureFlowTrend
            - waterCutGorTrend
          properties:
            wellhead:
              $ref: "#/components/schemas/WellheadAsset"
            latestReadingAt:
              type: [string, "null"]
              format: date-time
            latestReadings:
              type: array
              items:
                $ref: "#/components/schemas/WellheadReading"
            activeAlarms:
              type: array
              items:
                $ref: "#/components/schemas/ActiveAlarm"
            pressureTrend:
              type: array
              items:
                $ref: "#/components/schemas/AggregateTrendPoint"
            temperatureFlowTrend:
              type: array
              items:
                $ref: "#/components/schemas/AggregateTrendPoint"
            waterCutGorTrend:
              type: array
              items:
                $ref: "#/components/schemas/AggregateTrendPoint"
    WellheadAsset:
      type: object
      required:
        - wellheadId
        - wellheadName
        - locationId
        - locationName
        - fieldId
        - fieldName
      properties:
        wellheadId:
          type: integer
        wellheadName:
          type: string
        wellheadType:
          type: [string, "null"]
        status:
          type: [string, "null"]
        locationId:
          type: integer
        locationName:
          type: string
        fieldId:
          type: integer
        fieldName:
          type: string
    DashboardSummary:
      type: object
      required: [totalWellheads, parametersTracked, activeAlarms, latestReadingAt]
      properties:
        totalWellheads:
          type: integer
        parametersTracked:
          type: integer
        activeAlarms:
          type: integer
        latestReadingAt:
          type: [string, "null"]
          format: date-time
    WellheadReading:
      type: object
      description: Row returned from the wellhead parameter readings view.
      properties:
        timestampUtc:
          type: [string, "null"]
          format: date-time
        rawValue:
          type: [number, "null"]
        wellheadId:
          type: [integer, "null"]
        wellheadName:
          type: string
        wellheadType:
          type: [string, "null"]
        locationName:
          type: [string, "null"]
        fieldName:
          type: [string, "null"]
        parameterCode:
          type: [string, "null"]
        parameterDisplayName:
          type: string
        canonicalUnit:
          type: [string, "null"]
        dataType:
          type: [string, "null"]
        normalMin:
          type: [number, "null"]
        normalMax:
          type: [number, "null"]
    ActiveAlarm:
      type: object
      description: Active alarm event from the alarm view.
      properties:
        eventId:
          type: [integer, "null"]
        triggeredAt:
          type: [string, "null"]
          format: date-time
        severityLevel:
          type: [string, "null"]
        triggeredValue:
          type: [number, "null"]
        wellheadId:
          type: [integer, "null"]
        wellheadName:
          type: [string, "null"]
        locationName:
          type: [string, "null"]
        fieldName:
          type: [string, "null"]
        parameterCode:
          type: [string, "null"]
        parameterDisplayName:
          type: [string, "null"]
        canonicalUnit:
          type: [string, "null"]
        operator:
          type: [string, "null"]
        thresholdValue:
          type: [number, "null"]
        alarmRuleId:
          type: [integer, "null"]
    AggregateTrendPoint:
      type: object
      description: Two-minute aggregate trend point from a TimescaleDB continuous aggregate.
      properties:
        bucketTime:
          type: [string, "null"]
          format: date-time
        parameterCode:
          type: [string, "null"]
        parameterDisplayName:
          type: [string, "null"]
        canonicalUnit:
          type: [string, "null"]
        avgValue:
          type: [number, "null"]
        minValue:
          type: [number, "null"]
        maxValue:
          type: [number, "null"]
        readingCount:
          type: [integer, "null"]
    AlarmCount:
      type: object
      description: Alarms triggered in the last 24 hours for one severity.
      required: [severityLevel, alarmsTriggered]
      properties:
        severityLevel:
          type: [string, "null"]
        alarmsTriggered:
          type: integer
          minimum: 0
    ErrorResponse:
      type: object
      properties:
        msg:
          type: string
        status:
          type: integer
        error:
          type: string
        hint:
          type: string
