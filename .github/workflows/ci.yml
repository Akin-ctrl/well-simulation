name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (types, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monorepo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.11.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: monorepo/.nvmrc
          cache: pnpm
          cache-dependency-path: monorepo/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm turbo run check-types

      - name: Lint
        run: pnpm turbo run lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:dto

  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # These four are what make the project's coding standards enforceable
      # for the Python services rather than advisory.
      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest

      - name: Validate OpenAPI specifications
        run: python3 scripts/validate_openapi.py

      # Standard 4: the objective half of the plain English rules. Tone stays
      # with review; a checker cannot judge it.
      - name: Check prose
        run: python3 scripts/check_prose.py

  api-tests:
    name: API integration tests
    runs-on: ubuntu-latest
    # These run against a real TimescaleDB. The dashboard reads continuous
    # aggregates and alarm evaluation lives in a trigger, so a mocked database
    # would verify almost nothing that matters.
    services:
      db:
        image: timescale/timescaledb:latest-pg14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_HOST: localhost
      TEST_POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TEST_JWT_SECRET: ci-secret-of-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.11.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: monorepo/.nvmrc
          cache: pnpm
          cache-dependency-path: monorepo/pnpm-lock.yaml

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The suite applies schema via the same migrator the stack uses, so the
      # migrator's dependencies are required here.
      - name: Install migrator dependencies
        run: pip install -r requirements-dev.txt

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: monorepo

      - name: Run API integration tests
        run: pnpm --filter @well-simulation/api test
        working-directory: monorepo

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Compose interpolates these at config-parse time even for `build`.
      # The example values are non-secret placeholders.
      - name: Provide placeholder environment
        run: cp .env.example .env

      - name: Build all service images
        run: docker compose build
