# Long-lived caching for static files, chosen by file extension. Built
# assets carry a content hash in their name, so they never change in place.
#
# The value is set by one add_header at server level instead of inside the
# assets location. nginx drops every server-level add_header in a location
# that sets its own, so the assets used to be served without nosniff, the
# frame policy, or the CSP. An empty value makes nginx omit the header, so
# pages and API responses still send no Cache-Control.
map $uri $static_cache_control {
  ~*\.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ "public, max-age=2592000, immutable";
  default "";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Do not advertise the server version.
  server_tokens off;

  add_header Cache-Control $static_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  # The image build replaces the placeholder in script-src with a sha256 hash of each
  # inline startup script React Router writes into index.html
  # (scripts/csp-inline-script-hashes.mjs). Without them the browser refuses
  # those scripts and the dashboard renders a blank page. Do not swap the
  # hashes for 'unsafe-inline': that would also run any injected script.
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' __INLINE_SCRIPT_HASHES__; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # HSTS is intentionally NOT set here: this stack serves plain HTTP on :8090,
  # and sending it over HTTP would pin browsers to an https:// origin that does
  # not exist. Enable it at the TLS terminator in a real deployment.

  location = /api {
    return 308 /api/;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    # $http_host preserves the port; $host drops it. The API compares the
    # request Origin against its own host to reject cross-site state-changing
    # requests, and a missing port makes every same-origin POST look foreign.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # No add_header here, or the server-level headers above stop applying.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
    try_files $uri =404;
  }
}
