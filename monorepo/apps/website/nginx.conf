server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Do not advertise the server version.
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy
    "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # HSTS is intentionally NOT set here: this stack serves plain HTTP on :8082,
  # and sending it over HTTP would pin browsers to an https:// origin that does
  # not exist. Enable it at the TLS terminator in a real deployment.

  location = /api {
    return 308 /api/;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    # $http_host preserves the port; $host drops it. The API compares the
    # request Origin against its own host to reject cross-site state-changing
    # requests, and a missing port makes every same-origin POST look foreign.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}
