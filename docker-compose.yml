services:
  db:
    # PostgreSQL 16.15 / TimescaleDB 2.30.2. See the engine upgrade design.
    image: timescale/timescaledb@sha256:6f139d56042989bd35f50ba5986e492cd32e35cc6778c50be2659add298dc09f
    container_name: wellhead_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5434:5432"
    # Schema is applied by the migrator service, not by mounting SQL into
    # /docker-entrypoint-initdb.d. That directory runs only on first
    # initialisation of the volume, so every schema change previously required
    # `docker compose down -v` and destroyed the historian.
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wellnet
  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: wellhead_pgadmin
  #   environment:
  #     - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
  #     - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
  #   ports:
  #     - "5050:80"
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - wellnet

  # Installs or checks the current schema, then exits. Existing legacy databases
  # require an explicit, verified adoption before this default startup check.
  migrator:
    build: ./data/src
    container_name: wellhead_migrator
    command: python schema.py
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/sql:/sql:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TWIN_DB_USER: ${TWIN_DB_USER}
      TWIN_DB_PASSWORD: ${TWIN_DB_PASSWORD}
      API_DB_USER: ${API_DB_USER:?Set API_DB_USER to a separate application login}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD}
    networks:
      - wellnet

  twin-core:
    build: ./twin_core
    container_name: well_simulation_twin_core
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      TWIN_DB_USER: ${TWIN_DB_USER}
      TWIN_DB_PASSWORD: ${TWIN_DB_PASSWORD}
      TWIN_SERVICE_PORT: "8000"
      TWIN_INTERNAL_TOKEN: ${TWIN_INTERNAL_TOKEN}
      TWIN_MAX_CATCHUP_STEPS: "5"
      TWIN_FLEET_REFRESH_SECONDS: "30"
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-5}
      TWIN_MODEL_OVERRIDES_JSON: ${TWIN_MODEL_OVERRIDES_JSON:-}
    expose:
      - "8000"
    networks:
      - wellnet

  modbus:
    build: ./data/src
    container_name: modbus_gateway
    command: python modbus_gateway.py
    # Readiness fails when twin-core is unavailable; heartbeat stops advancing.
    restart: unless-stopped
    ports:
      - "5020:5020"
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      twin-core:
        condition: service_healthy
    networks:
      - wellnet
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MODBUS_PORT: ${MODBUS_PORT}
      MODBUS_BIND_HOST: "0.0.0.0"
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-5}
      SERVICE_PORT: "9102"
      TWIN_CORE_SNAPSHOT_URL: http://twin-core:8000/model-snapshot

  ingestion:
    build: ./data/src
    container_name: database_ingestion
    command: python database_ingestion.py
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      modbus:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MODBUS_HOST: modbus
      MODBUS_PORT: ${MODBUS_PORT}
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-5}
      SERVICE_PORT: "9101"

    networks:
      - wellnet

  api:
    build:
      context: ./monorepo
      dockerfile: apps/api/Dockerfile
    container_name: well_simulation_api
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${API_DB_USER}:${API_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      TWIN_CORE_URL: http://twin-core:8000
      TWIN_INTERNAL_TOKEN: ${TWIN_INTERNAL_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # The dashboard's nginx is the only thing that should speak for a client.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
    # Port 3000 is deliberately not published: the dashboard proxies /api, and
    # exposing the API directly bypasses that proxy and the rate limiter's
    # trusted-proxy handling. Add a compose override for direct local access.
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - wellnet

  dashboard:
    build:
      context: ./monorepo
      dockerfile: apps/website/Dockerfile
    container_name: well_simulation_dashboard
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8090:80"
    restart: unless-stopped
    # The image checks both the static page and /api/ready through nginx.
    networks:
      - wellnet

  prometheus:
    image: prom/prometheus@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=0.0.0.0:9090
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks: [wellnet]

  grafana:
    image: grafana/grafana@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    profiles: [observability]
    entrypoint: [/bin/sh, /etc/grafana/start.sh]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-health.json
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - ./observability/grafana/start.sh:/etc/grafana/start.sh:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s
    restart: unless-stopped
    networks: [wellnet]

volumes:
  timescaledb_data:
    # Keep the existing default name. A major-version upgrade selects its
    # verified new volume explicitly, preserving the original for recovery.
    name: ${TIMESCALE_DATA_VOLUME:-${COMPOSE_PROJECT_NAME}_timescaledb_data}
  pgadmin_data:
  prometheus_data:
  grafana_data:

networks:
  wellnet:
    name: wellnet
    driver: bridge
