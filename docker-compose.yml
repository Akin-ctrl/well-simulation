services:
  db:
    image: timescale/timescaledb:latest-pg14
    container_name: wellhead_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5434:5432"
    # Schema is applied by the migrator service, not by mounting SQL into
    # /docker-entrypoint-initdb.d. That directory runs only on first
    # initialisation of the volume, so every schema change previously required
    # `docker compose down -v` and destroyed the historian.
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wellnet
  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: wellhead_pgadmin
  #   environment:
  #     - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
  #     - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
  #   ports:
  #     - "5050:80"
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - wellnet

  # Applies the ordered SQL migrations, then exits. Every service that reads or
  # writes the schema waits for it to finish successfully.
  migrator:
    build: ./data/src
    container_name: wellhead_migrator
    command: python schema.py
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/sql:/sql:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    networks:
      - wellnet

  modbus:
    build: ./data/src
    container_name: modbus_gateway
    command: python modbus_gateway.py
    # The gateway exits when its telemetry source stops, rather than serving
    # stale registers. Restarting is how it recovers.
    restart: unless-stopped
    ports:
      - "5020:5020"
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - wellnet
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MODBUS_PORT: ${MODBUS_PORT}
      MODBUS_BIND_HOST: "0.0.0.0"
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-5}
      SERVICE_PORT: "9102"

  ingestion:
    build: ./data/src
    container_name: database_ingestion
    command: python database_ingestion.py
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      modbus:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MODBUS_HOST: modbus
      MODBUS_PORT: ${MODBUS_PORT}
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-5}
      SERVICE_PORT: "9101"

    networks:
      - wellnet

  api:
    build:
      context: ./monorepo
      dockerfile: apps/api/Dockerfile
    container_name: well_simulation_api
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # The dashboard's nginx is the only thing that should speak for a client.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
    # Port 3000 is deliberately not published: the dashboard proxies /api, and
    # exposing the API directly bypasses that proxy and the rate limiter's
    # trusted-proxy handling. Add a compose override for direct local access.
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - wellnet

  dashboard:
    build:
      context: ./monorepo
      dockerfile: apps/website/Dockerfile
    container_name: well_simulation_dashboard
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8090:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - wellnet

volumes:
  timescaledb_data:
  pgadmin_data:

networks:
  wellnet:
    name: wellnet
    driver: bridge
