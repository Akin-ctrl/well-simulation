global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
storage:
  tsdb:
    retention:
      time: 7d
      size: 512MB
rule_files:
  - /etc/prometheus/service.rules.yml
scrape_configs:
  - job_name: twin-core
    static_configs:
      - targets: [twin-core:8000]
  - job_name: api
    static_configs:
      - targets: [api:3000]
  - job_name: modbus
    static_configs:
      - targets: [modbus:9102]
  - job_name: ingestion
    static_configs:
      - targets: [ingestion:9101]
